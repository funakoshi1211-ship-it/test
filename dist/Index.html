  <script>
/*
 * シフト作成ロジック（自動作成とルール判定）。
 * ブラウザ側で動かす。GAS のサーバー側はデータの読み書きだけを担当する。
 *
 * データの形
 *   master   : 店舗・必要人数・社員・祝日・臨時営業・当番日・特別期間（Code.gs の getData を参照）
 *   requests : { 社員ID: { 'YYYY-MM-DD': { AM, PM, N } } }  事前に決まっている枠（希望休・※・重信など）
 *   cells    : 同じ形。作成したシフト
 *   AM/PM には店舗記号・勤務外の記号・休みの記号、N には '準夜' / '深夜' が入る
 */
var ShiftLogic = (function () {
  var OFF = ['定休', '休', '有給', '特休', '×', '明', '入', '夜'];
  var LEAVE = ['有給', '特休']; // 公休（週2日）とは別に取る休み
  var AWAY = ['※', '重信', '在宅'];
  var NIGHT = ['準夜', '深夜'];
  var WANT = '出';
  var SLOTS = ['AM', 'PM'];
  var DUTY_STORE = '三';
  var WEEK_OFF = 2;
  var MAX_STREAK = 6;
  var DEFAULT_PART_WEEK_MAX = 3;

  // ---------- 日付 ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ds(y, m, d) {
    var t = new Date(Date.UTC(y, m - 1, d));
    return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate());
  }
  function parts(s) { var p = s.split('-'); return [+p[0], +p[1], +p[2]]; }
  function addDays(s, n) { var p = parts(s); return ds(p[0], p[1], p[2] + n); }
  function dow(s) { var p = parts(s); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function daysInMonth(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }

  // 店舗の記号。手入力の「三 8:30-14:30」のように、先頭が店舗記号の文字もその店舗として数える
  function storeOf(ctx, v) {
    if (!v) return null;
    if (ctx.storeSet[v]) return v;
    var head = String(v).charAt(0);
    return String(v).length > 1 && ctx.storeSet[head] ? head : null;
  }
  function isStore(ctx, v) { return !!storeOf(ctx, v); }
  function roleOf(s) { return s.job === '事務' ? 'clerk' : 'pharm'; }
  function isRegular(s) { return s.kind === '常勤' || s.kind === '準常勤'; }
  function isExternal(s) { return s.kind === '外部'; }
  function allowedStores(s) {
    var list = s.home ? [s.home] : [];
    (s.canStores || []).forEach(function (c) { if (list.indexOf(c) < 0) list.push(c); });
    return list;
  }

  // ---------- カレンダーと必要人数 ----------
  function buildContext(M, y, m) {
    var ctx = { y: y, m: m, M: M, days: [], storeSet: {}, stores: M.stores.map(function (s) { return s.code; }) };
    ctx.stores.forEach(function (c) { ctx.storeSet[c] = true; });
    // 休業日。店舗が空欄なら全店舗、記号があればその店舗だけ
    var hol = {}, storeHol = {};
    (M.holidays || []).forEach(function (h) {
      if (h.store) storeHol[h.date + '|' + h.store] = h.name || '休業日';
      else hol[h.date] = h.name || '祝日';
    });
    var duty = {}; (M.dutyDates || []).forEach(function (d) { duty[d] = true; });
    var extra = {};
    (M.extraOpen || []).forEach(function (e) {
      var slots = e.slot === 'AM' || e.slot === 'PM' ? [e.slot] : SLOTS;
      slots.forEach(function (sl) { extra[e.date + '|' + e.store + '|' + sl] = true; });
    });
    var n = daysInMonth(y, m);
    for (var d = 1; d <= n; d++) {
      var date = ds(y, m, d), w = dow(date);
      var special = null;
      (M.specialPeriods || []).forEach(function (p) { if (date >= p.start && date <= p.end) special = p; });
      ctx.days.push({ date: date, d: d, dow: w, holiday: hol[date] || null, duty: !!duty[date], special: special,
        closed: w === 0 || !!hol[date] });
    }
    ctx.dayOf = {}; ctx.days.forEach(function (x) { ctx.dayOf[x.date] = x; });
    ctx.hol = hol; ctx.storeHol = storeHol; ctx.dutySet = duty; ctx.extra = extra;
    ctx.staff = M.staff.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    ctx.staffById = {}; ctx.staff.forEach(function (s) { ctx.staffById[s.id] = s; });

    // 週（日曜はじまり）。月の外にはみ出す日数も持っておく
    var weeks = [], cur = null;
    ctx.days.forEach(function (x) {
      if (!cur || x.dow === 0) { cur = { days: [] }; weeks.push(cur); }
      cur.days.push(x);
    });
    weeks.forEach(function (wk) { wk.missing = 7 - wk.days.length; });
    ctx.weeks = weeks;
    return ctx;
  }

  // その店舗・日付・時間帯が開いているか。'normal' | 'duty' | null
  function openKind(ctx, store, date, slot) {
    var day = ctx.dayOf[date];
    if (!day) return null;
    if (ctx.extra[date + '|' + store + '|' + slot]) return 'normal';
    var normal = !day.closed && !ctx.storeHol[date + '|' + store] && (day.dow !== 6 || slot === 'AM');
    if (normal) return 'normal';
    if (day.duty && store === DUTY_STORE) return 'duty';
    return null;
  }

  // 月の外の日も含めて、その店舗がその日まるごと休みか（特別期間の休日数の見込みに使う）
  function closedOn(ctx, store, date) {
    if (ctx.extra[date + '|' + store + '|AM'] || ctx.extra[date + '|' + store + '|PM']) return false;
    return dow(date) === 0 || !!ctx.hol[date] || !!ctx.storeHol[date + '|' + store];
  }

  // 正社員の休日数をそろえる特別期間（この月にかかるもの）
  function targetPeriods(ctx) {
    var first = ctx.days[0].date, last = ctx.days[ctx.days.length - 1].date;
    return (ctx.M.specialPeriods || []).filter(function (p) { return +p.targetOff > 0 && p.start <= last && p.end >= first; });
  }

  function findReq(rows, store, dayType, slot) {
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.store === store && r.dayType === dayType && r.slot === slot) return r;
    }
    return null;
  }

  // 必要人数 { min, soft }。開いていなければ null
  function required(ctx, store, date, slot, role) {
    var kind = openKind(ctx, store, date, slot);
    if (!kind) return null;
    var day = ctx.dayOf[date];
    var dayType = kind === 'duty' ? '当番' : (day.dow === 6 ? '土曜' : '平日');
    var row = null, soft = false;
    if (day.special) {
      soft = true;
      row = findReq((ctx.M.specialReqs || []).filter(function (r) { return r.period === day.special.name; }), store, dayType, slot);
    }
    if (!row) row = findReq(ctx.M.requirements || [], store, dayType, slot);
    if (!row && kind === 'duty') row = { pharm: 1, clerk: 0 };
    if (!row) return { min: 0, soft: soft };
    return { min: +(role === 'pharm' ? row.pharm : row.clerk) || 0, soft: soft };
  }

  // ---------- セル ----------
  function blankCell() { return { AM: '', PM: '', N: '' }; }
  function cellOf(cells, id, date) {
    if (!cells[id]) cells[id] = {};
    if (!cells[id][date]) cells[id][date] = blankCell();
    return cells[id][date];
  }
  function peek(map, id, date) { return (map[id] && map[id][date]) || null; }
  function reqVal(R, id, date, key) { var c = peek(R, id, date); return c ? (c[key] || '') : ''; }

  function isWorkingCell(ctx, c) {
    if (!c) return false;
    if (c.N) return true;
    // 店舗・※・重信・在宅のほか、手入力の文字（「研修」など）も出勤として数える
    return SLOTS.some(function (k) { var v = c[k]; return !!v && OFF.indexOf(v) < 0 && v !== WANT; });
  }
  // 有給・特休の日（公休には数えない）
  function isLeaveDay(ctx, c) {
    return !!c && !isWorkingCell(ctx, c) && SLOTS.some(function (k) { return LEAVE.indexOf(c[k]) >= 0; });
  }
  function isStoreDay(ctx, c) { return !!c && SLOTS.some(function (k) { return isStore(ctx, c[k]); }); }

  function countAt(ctx, cells, store, date, slot, role) {
    var n = 0;
    ctx.staff.forEach(function (s) {
      if (roleOf(s) !== role) return;
      var c = peek(cells, s.id, date);
      if (c && storeOf(ctx, c[slot]) === store) n++;
    });
    return n;
  }

  function streakAround(ctx, cells, id, date) {
    // date を出勤にしたときの連勤日数
    var n = 1, d = addDays(date, -1);
    while (ctx.dayOf[d] && isWorkingCell(ctx, peek(cells, id, d))) { n++; d = addDays(d, -1); }
    d = addDays(date, 1);
    while (ctx.dayOf[d] && isWorkingCell(ctx, peek(cells, id, d))) { n++; d = addDays(d, 1); }
    return n;
  }

  function weekOf(ctx, date) {
    for (var i = 0; i < ctx.weeks.length; i++) {
      if (ctx.weeks[i].days.some(function (x) { return x.date === date; })) return ctx.weeks[i];
    }
    return null;
  }
  function workDaysInWeek(ctx, cells, id, wk) {
    return wk.days.filter(function (x) { return isWorkingCell(ctx, peek(cells, id, x.date)); }).length;
  }

  // 特別期間の公休の日数（店舗の休業日・定休・休。有給・特休は数えない）。
  // 月の外の日は、保存済みのシフトがあればそれを、なければ店舗の休業日から見込む
  function periodOff(ctx, cells, s, p) {
    var adj = ctx.M.adjacent || {}, off = 0;
    function rest(c) { return !isWorkingCell(ctx, c) && !isLeaveDay(ctx, c); }
    for (var d = p.start; d <= p.end; d = addDays(d, 1)) {
      if (ctx.dayOf[d]) { if (rest(peek(cells, s.id, d) || blankCell())) off++; }
      else if (adj[s.id] && adj[s.id][d]) { if (rest(adj[s.id][d])) off++; }
      else if (s.home && closedOn(ctx, s.home, d)) off++;
    }
    return off;
  }

  // ---------- 自動作成 ----------
  function generate(M, R, y, m) {
    var ctx = buildContext(M, y, m);
    var cells = {};
    var stats = {};
    ctx.staff.forEach(function (s) {
      stats[s.id] = { night: 0, dutyDay: 0, moves: 0 };
      ctx.days.forEach(function (x) {
        var r = peek(R, s.id, x.date), c = cellOf(cells, s.id, x.date);
        if (r) { c.AM = r.AM || ''; c.PM = r.PM || ''; c.N = r.N || ''; }
        if (c.AM === WANT) c.AM = '';
        if (c.PM === WANT) c.PM = '';
      });
    });
    function locked(id, date, key) { return !!reqVal(R, id, date, key); }
    function dayLocked(id, date) { return SLOTS.some(function (k) { return locked(id, date, k); }) || locked(id, date, 'N'); }
    function wantsWork(id, date) { return SLOTS.some(function (k) { return reqVal(R, id, date, k) === WANT; }); }
    function offRequested(id, date, key) { var v = reqVal(R, id, date, key); return OFF.indexOf(v) >= 0; }
    function ngDay(s, date) { return (s.ngWeekdays || []).indexOf(dow(date)) >= 0; }
    function prefOff(s, date) { return (s.prefOffWeekdays || []).indexOf(dow(date)) >= 0; }

    // 1. 夜間当番（三番町）
    ctx.days.forEach(function (x) {
      if (!x.duty) return;
      var nextDate = addDays(x.date, 1);
      var eligible = ctx.staff.filter(function (s) { return s.night && roleOf(s) === 'pharm'; });

      function canNight(s, date) {
        var c = peek(cells, s.id, date);
        if (!c) return false;
        if (c.N) return false;
        if (ngDay(s, date)) return false;
        if (SLOTS.some(function (k) { return offRequested(s.id, date, k); })) return false;
        if (isExternal(s) && !wantsWork(s.id, date)) return false;
        return true;
      }
      // 準夜 16-24
      var hasEve = ctx.staff.some(function (s) { var c = peek(cells, s.id, x.date); return c && c.N === '準夜'; });
      if (!hasEve) {
        var cand = eligible.filter(function (s) {
          if (!canNight(s, x.date)) return false;
          // 準夜勤の日は日中に勤務しないので、日中の予定が決まっている人は外す
          if (SLOTS.some(function (k) { var v = reqVal(R, s.id, x.date, k); return v && OFF.indexOf(v) < 0; })) return false;
          var prev = peek(cells, s.id, addDays(x.date, -1));
          return !(prev && prev.N === '深夜');
        }).sort(function (a, b) { return stats[a.id].night - stats[b.id].night; });
        if (cand.length) { cellOf(cells, cand[0].id, x.date).N = '準夜'; stats[cand[0].id].night++; }
      }
      // 深夜 0-9（翌日）。その日は日中勤務なし
      if (ctx.dayOf[nextDate]) {
        var hasLate = ctx.staff.some(function (s) { var c = peek(cells, s.id, nextDate); return c && c.N === '深夜'; });
        if (!hasLate) {
          var cand2 = eligible.filter(function (s) {
            if (!canNight(s, nextDate)) return false;
            if (SLOTS.some(function (k) { return locked(s.id, nextDate, k) && reqVal(R, s.id, nextDate, k) !== WANT; })) return false;
            var today = peek(cells, s.id, x.date);
            if (today && today.N === '準夜') return false;
            // 前日（当番日）は午前 9-13 だけ勤務できる。午後に予定が決まっている人は外す
            var pmReq = reqVal(R, s.id, x.date, 'PM');
            return !(pmReq && OFF.indexOf(pmReq) < 0);
          }).sort(function (a, b) {
            // 外部の人がいればそちらを優先（社内の日中勤務を減らさないため）
            var ea = isExternal(a) ? 0 : 1, eb = isExternal(b) ? 0 : 1;
            return ea - eb || stats[a.id].night - stats[b.id].night;
          });
          if (cand2.length) { cellOf(cells, cand2[0].id, nextDate).N = '深夜'; stats[cand2[0].id].night++; }
        }
      }
    });
    // 準夜の日は日中勤務なし（店舗の人数にも数えない）。翌日は通常どおり出勤できる
    // 深夜の日は日中勤務なし
    ctx.staff.forEach(function (s) {
      ctx.days.forEach(function (x) {
        var c = peek(cells, s.id, x.date);
        if (c && c.N === '準夜') SLOTS.forEach(function (k) { if (!locked(s.id, x.date, k)) c[k] = '夜'; });
        if (!c || c.N !== '深夜') return;
        SLOTS.forEach(function (k) { if (!locked(s.id, x.date, k)) c[k] = '明'; });
        // 前日の午後は勤務なし（午前 9-13 のみ）
        var prev = peek(cells, s.id, addDays(x.date, -1));
        if (prev && !locked(s.id, addDays(x.date, -1), 'PM')) prev.PM = '入';
      });
    });

    // 2. 当番日の日中（日曜・祝日・土曜午後の三番町）
    ctx.days.forEach(function (x) {
      if (!x.duty) return;
      var dutySlots = SLOTS.filter(function (k) { return openKind(ctx, DUTY_STORE, x.date, k) === 'duty'; });
      if (!dutySlots.length) return;
      var need = required(ctx, DUTY_STORE, x.date, dutySlots[0], 'pharm');
      var have = countAt(ctx, cells, DUTY_STORE, x.date, dutySlots[0], 'pharm');
      if (!need || have >= need.min) return;
      var cand = ctx.staff.filter(function (s) {
        if (roleOf(s) !== 'pharm' || isExternal(s)) return false;
        if (allowedStores(s).indexOf(DUTY_STORE) < 0) return false;
        var c = peek(cells, s.id, x.date);
        if (c.N) return false;
        if (ngDay(s, x.date)) return false;
        if (dutySlots.some(function (k) { return locked(s.id, x.date, k) || c[k]; })) return false;
        return streakAround(ctx, cells, s.id, x.date) <= MAX_STREAK;
      }).sort(function (a, b) {
        var ha = a.home === DUTY_STORE ? 0 : 1, hb = b.home === DUTY_STORE ? 0 : 1;
        return stats[a.id].dutyDay - stats[b.id].dutyDay || ha - hb;
      });
      for (var i = 0; i < cand.length && have < need.min; i++) {
        var c = cellOf(cells, cand[i].id, x.date);
        dutySlots.forEach(function (k) { c[k] = DUTY_STORE; });
        stats[cand[i].id].dutyDay++;
        have++;
      }
    });

    // 3. 常勤の休み（週2日）を決める
    var regulars = ctx.staff.filter(isRegular);
    // 全員が出勤した場合の人数の見込み
    var supply = {};
    function key(store, date, slot, role) { return store + '|' + date + '|' + slot + '|' + role; }
    function homeOpenSlots(s, date) {
      return SLOTS.filter(function (k) { return s.home && openKind(ctx, s.home, date, k) === 'normal'; });
    }
    function plannedOff(s, date) {
      var c = peek(cells, s.id, date);
      if (isWorkingCell(ctx, c)) return false;
      if (!homeOpenSlots(s, date).length) return true;
      // 「入」（深夜勤の前日の午後）は休みではない。午前は勤務する
      return SLOTS.some(function (k) { return OFF.indexOf(c[k]) >= 0 && c[k] !== '入'; }) || ngDay(s, date);
    }
    regulars.forEach(function (s) {
      ctx.days.forEach(function (x) {
        if (plannedOff(s, x.date)) return;
        homeOpenSlots(s, x.date).forEach(function (k) {
          var v = peek(cells, s.id, x.date)[k];
          if (v && !isStore(ctx, v)) return;
          var kk = key(s.home, x.date, k, roleOf(s)); supply[kk] = (supply[kk] || 0) + 1;
        });
      });
    });
    function slackIfOff(s, date) {
      var worst = Infinity;
      homeOpenSlots(s, date).forEach(function (k) {
        var r = required(ctx, s.home, date, k, roleOf(s));
        var sl = (supply[key(s.home, date, k, roleOf(s))] || 0) - 1 - (r ? r.min : 0);
        if (sl < worst) worst = sl;
      });
      return worst === Infinity ? 99 : worst;
    }
    function takeOff(s, date, code) {
      var c = cellOf(cells, s.id, date);
      homeOpenSlots(s, date).forEach(function (k) {
        var kk = key(s.home, date, k, roleOf(s)); supply[kk] = (supply[kk] || 0) - 1;
      });
      SLOTS.forEach(function (k) { if (!locked(s.id, date, k) && openKind(ctx, s.home, date, k)) c[k] = code; });
    }
    ctx.weeks.forEach(function (wk) {
      // 休みを取りにくい（固定配置の）人から決める
      var order = regulars.slice().sort(function (a, b) { return (b.fixed ? 1 : 0) - (a.fixed ? 1 : 0); });
      order.forEach(function (s) {
        // 公休の数（有給・特休は数えない）
        var off = wk.days.filter(function (x) { return plannedOff(s, x.date) && !isLeaveDay(ctx, peek(cells, s.id, x.date)); }).length;
        var need = Math.max(0, WEEK_OFF - off - wk.missing);
        for (var i = 0; i < need; i++) {
          var cand = wk.days.filter(function (x) {
            return !plannedOff(s, x.date) && !dayLocked(s.id, x.date) && !peek(cells, s.id, x.date).N &&
              !isStoreDay(ctx, peek(cells, s.id, x.date));
          });
          if (!cand.length) break;
          cand.sort(function (a, b) {
            // 人が足りなくならない日の中で、本人の希望曜日を優先する
            var oa = slackIfOff(s, a.date) >= 0 ? 0 : 1, ob = slackIfOff(s, b.date) >= 0 ? 0 : 1;
            if (oa !== ob) return oa - ob;
            var pa = prefOff(s, a.date) ? 0 : 1, pb = prefOff(s, b.date) ? 0 : 1;
            if (pa !== pb) return pa - pb;
            var d = slackIfOff(s, b.date) - slackIfOff(s, a.date);
            if (d) return d;
            return homeOpenSlots(s, a.date).length - homeOpenSlots(s, b.date).length;
          });
          takeOff(s, cand[0].date, '定休');
        }
        // 在宅・店舗出勤日数の上限
        if (s.weeklyRemote || s.weeklyStoreMax) {
          var workDays = wk.days.filter(function (x) { return !plannedOff(s, x.date); });
          var remote = Math.min(+s.weeklyRemote || 0, Math.max(0, workDays.length - 1));
          var alreadyRemote = workDays.filter(function (x) { return SLOTS.some(function (k) { return peek(cells, s.id, x.date)[k] === '在宅'; }); }).length;
          remote = Math.max(0, remote - alreadyRemote);
          var storeDays = workDays.length - alreadyRemote - remote;
          if (s.weeklyStoreMax && storeDays > s.weeklyStoreMax) remote += storeDays - s.weeklyStoreMax;
          for (var j = 0; j < remote; j++) {
            var c2 = workDays.filter(function (x) {
              var c = peek(cells, s.id, x.date);
              return !dayLocked(s.id, x.date) && !c.N && !isStoreDay(ctx, c) && SLOTS.every(function (k) { return c[k] !== '在宅'; });
            });
            if (!c2.length) break;
            c2.sort(function (a, b) { return slackIfOff(s, b.date) - slackIfOff(s, a.date); });
            takeOff(s, c2[0].date, '在宅');
          }
        }
      });
    });

    // 4. 常勤を所属店舗に配置
    regulars.forEach(function (s) {
      ctx.days.forEach(function (x) {
        if (plannedOff(s, x.date)) return;
        var c = peek(cells, s.id, x.date);
        homeOpenSlots(s, x.date).forEach(function (k) { if (!c[k]) c[k] = s.home; });
      });
    });

    // 4b. 連勤が上限を超えたら、その中の1日を定休にする（当番日の日曜勤務などで起きる）
    regulars.forEach(function (s) {
      var guard = 0;
      while (guard++ < 10) {
        var run = [], found = null;
        ctx.days.forEach(function (x) {
          if (found) return;
          if (isWorkingCell(ctx, peek(cells, s.id, x.date))) {
            run.push(x);
            if (run.length > MAX_STREAK) found = run.slice();
          } else run = [];
        });
        if (!found) break;
        var cand = found.filter(function (x) {
          var c = peek(cells, s.id, x.date);
          return !dayLocked(s.id, x.date) && !c.N && homeOpenSlots(s, x.date).length &&
            SLOTS.every(function (k) { return !c[k] || c[k] === s.home; });
        });
        if (!cand.length) break;
        cand.sort(function (a, b) {
          function slack(x) {
            var worst = Infinity;
            homeOpenSlots(s, x.date).forEach(function (k) {
              var r = required(ctx, s.home, x.date, k, roleOf(s));
              var sl = countAt(ctx, cells, s.home, x.date, k, roleOf(s)) - (r ? r.min : 0);
              if (sl < worst) worst = sl;
            });
            return worst;
          }
          return slack(b) - slack(a);
        });
        var cc = peek(cells, s.id, cand[0].date);
        SLOTS.forEach(function (k) { if (cc[k] === s.home) cc[k] = '定休'; });
      }
    });

    // 5. 非常勤の「出勤希望」日
    var parts_ = ctx.staff.filter(function (s) { return !isRegular(s) && !isExternal(s); });
    var partWeek = {};
    function pw(s, wk) { var k = s.id + '|' + wk.days[0].date; return partWeek[k] || 0; }
    function addPw(s, wk) { var k = s.id + '|' + wk.days[0].date; partWeek[k] = (partWeek[k] || 0) + 1; }
    parts_.forEach(function (s) {
      ctx.days.forEach(function (x) {
        var c = peek(cells, s.id, x.date), wk = weekOf(ctx, x.date);
        if (isStoreDay(ctx, c)) { addPw(s, wk); return; }
        if (!wantsWork(s.id, x.date)) return;
        var any = false;
        SLOTS.forEach(function (k) {
          if (reqVal(R, s.id, x.date, k) === WANT && s.home && openKind(ctx, s.home, x.date, k)) { c[k] = s.home; any = true; }
        });
        if (any) addPw(s, wk);
      });
    });

    // 6. 店舗間の応援で不足を埋める
    function balance() {
      var changed = true, guard = 0;
      while (changed && guard++ < 20) {
        changed = false;
        ctx.days.forEach(function (x) {
          SLOTS.forEach(function (k) {
            ['pharm', 'clerk'].forEach(function (role) {
              ctx.stores.forEach(function (target) {
                var r = required(ctx, target, x.date, k, role);
                if (!r) return;
                var have = countAt(ctx, cells, target, x.date, k, role);
                while (have < r.min) {
                  var best = null, bestScore = -Infinity;
                  ctx.staff.forEach(function (s) {
                    if (roleOf(s) !== role || s.fixed) return;
                    if (allowedStores(s).indexOf(target) < 0) return;
                    if (locked(s.id, x.date, k)) return;
                    var c = peek(cells, s.id, x.date), from = c[k];
                    if (!isStore(ctx, from) || from === target) return;
                    var rf = required(ctx, from, x.date, k, role);
                    var surplus = countAt(ctx, cells, from, x.date, k, role) - (rf ? rf.min : 0);
                    if (surplus <= 0) return;
                    var other = k === 'AM' ? 'PM' : 'AM';
                    var sameDay = c[other] === target ? 1 : 0; // 同じ日の移動は1回で済ませる
                    var score = surplus * 10 + sameDay * 5 - stats[s.id].moves;
                    if (score > bestScore) { bestScore = score; best = s; }
                  });
                  if (!best) break;
                  peek(cells, best.id, x.date)[k] = target;
                  stats[best.id].moves++;
                  have++; changed = true;
                }
              });
            });
          });
        });
      }
    }
    balance();

    // 6b. 特別期間（年末年始など）の公休の日数を正社員でそろえる
    //   多い人（自分の店舗の休業日が多い人）：多い分の休業日を有給消化にする（設定で「応援」「なし」も選べる）
    //   少ない人：人に余裕のある日から順に定休を入れる
    targetPeriods(ctx).forEach(function (p) {
      var target = +p.targetOff, over = p.overflow || '有給';
      var inMonth = ctx.days.filter(function (x) { return x.date >= p.start && x.date <= p.end; });
      function shortAt(store, date, k, role) {
        var r = required(ctx, store, date, k, role);
        return r ? r.min - countAt(ctx, cells, store, date, k, role) : 0;
      }
      function restOk(s, date) {
        var wk = weekOf(ctx, date), need = Math.max(0, WEEK_OFF - wk.missing);
        var rest = wk.days.filter(function (x) {
          if (x.date === date) return false;
          var c = peek(cells, s.id, x.date);
          return !isWorkingCell(ctx, c) && !isLeaveDay(ctx, c);
        }).length;
        return rest >= need;
      }
      // 自分の店舗だけの休業日（全店休業の日より先に有給・応援の対象にする）
      function closureDays(s) {
        return inMonth.filter(function (x) {
          var c = peek(cells, s.id, x.date);
          return s.home && closedOn(ctx, s.home, x.date) && !isWorkingCell(ctx, c) && !isLeaveDay(ctx, c) &&
            !dayLocked(s.id, x.date) && x.dow !== 0;
        }).sort(function (a, b) {
          var sa = ctx.storeHol[a.date + '|' + s.home] ? 0 : 1, sb = ctx.storeHol[b.date + '|' + s.home] ? 0 : 1;
          return sa - sb || (a.date < b.date ? 1 : -1);
        });
      }
      regulars.forEach(function (s) {
        var off = periodOff(ctx, cells, s, p), guard = 0;
        if (off > target && over === '応援' && !s.fixed) {
          while (off > target && guard++ < 31) {
            var best = null, bestNeed = 0, bestStore = null;
            closureDays(s).forEach(function (x) {
              if (ngDay(s, x.date) || !restOk(s, x.date) || streakAround(ctx, cells, s.id, x.date) > MAX_STREAK) return;
              allowedStores(s).forEach(function (st) {
                if (st === s.home) return;
                var need = 0;
                SLOTS.forEach(function (k) { if (openKind(ctx, st, x.date, k) === 'normal') need += Math.max(0, shortAt(st, x.date, k, roleOf(s))); });
                if (need > bestNeed) { bestNeed = need; best = x; bestStore = st; }
              });
            });
            if (!best) break;
            var cb = peek(cells, s.id, best.date);
            SLOTS.forEach(function (k) { cb[k] = openKind(ctx, bestStore, best.date, k) === 'normal' ? bestStore : ''; });
            stats[s.id].moves++;
            off--;
          }
        }
        if (off > target && over === '有給') {
          closureDays(s).slice(0, off - target).forEach(function (x) {
            var c = peek(cells, s.id, x.date);
            c.AM = '有給'; c.PM = '有給';
            off--;
          });
        }
        guard = 0;
        while (off < target && guard++ < 31) {
          var cand = inMonth.filter(function (x) {
            var c = peek(cells, s.id, x.date);
            return isStoreDay(ctx, c) && !dayLocked(s.id, x.date) && !c.N;
          });
          if (!cand.length) break;
          var slack = function (x) {
            var c = peek(cells, s.id, x.date), worst = Infinity;
            SLOTS.forEach(function (k) {
              if (!isStore(ctx, c[k])) return;
              var r = required(ctx, c[k], x.date, k, roleOf(s));
              var sl = countAt(ctx, cells, c[k], x.date, k, roleOf(s)) - (r ? r.min : 0);
              if (sl < worst) worst = sl;
            });
            return worst;
          };
          cand.sort(function (a, b) { return slack(b) - slack(a); });
          var cc = peek(cells, s.id, cand[0].date);
          SLOTS.forEach(function (k) { if (isStore(ctx, cc[k])) cc[k] = '定休'; });
          off++;
        }
      });
    });

    // 7. 非常勤で不足を埋める
    ctx.days.forEach(function (x) {
      var wk = weekOf(ctx, x.date);
      SLOTS.forEach(function (k) {
        ['pharm', 'clerk'].forEach(function (role) {
          ctx.stores.forEach(function (target) {
            var r = required(ctx, target, x.date, k, role);
            if (!r) return;
            var have = countAt(ctx, cells, target, x.date, k, role);
            while (have < r.min) {
              var cand = parts_.filter(function (s) {
                if (roleOf(s) !== role) return false;
                if (allowedStores(s).indexOf(target) < 0) return false;
                if (ngDay(s, x.date)) return false;
                var c = peek(cells, s.id, x.date);
                if (c[k] || c.N) return false;
                var working = isWorkingCell(ctx, c);
                if (!working) {
                  var max = s.weeklyMax || DEFAULT_PART_WEEK_MAX;
                  if (pw(s, wk) >= max) return false;
                  if (streakAround(ctx, cells, s.id, x.date) > MAX_STREAK) return false;
                }
                return true;
              }).sort(function (a, b) {
                var wa = isWorkingCell(ctx, peek(cells, a.id, x.date)) ? 0 : 1;
                var wb = isWorkingCell(ctx, peek(cells, b.id, x.date)) ? 0 : 1;
                var ha = a.home === target ? 0 : 1, hb = b.home === target ? 0 : 1;
                return wa - wb || ha - hb || pw(a, wk) - pw(b, wk);
              });
              if (!cand.length) break;
              var s = cand[0], c = peek(cells, s.id, x.date);
              if (!isWorkingCell(ctx, c)) addPw(s, wk);
              c[k] = target; have++;
            }
          });
        });
      });
    });
    balance();

    return cells;
  }

  // ---------- ルール判定 ----------
  function validate(M, R, cells, y, m) {
    var ctx = buildContext(M, y, m);
    var issues = [];
    var counts = {}; // counts[store][date][slot][role] = { have, min, soft }
    var seen = {};
    function add(level, msg, id, date) {
      var k = level + '|' + msg + '|' + id + '|' + date;
      if (seen[k]) return;
      seen[k] = true;
      issues.push({ level: level, msg: msg, id: id || null, date: date || null });
    }

    ctx.stores.forEach(function (st) {
      counts[st] = {};
      ctx.days.forEach(function (x) {
        counts[st][x.date] = {};
        SLOTS.forEach(function (k) {
          counts[st][x.date][k] = {};
          ['pharm', 'clerk'].forEach(function (role) {
            var r = required(ctx, st, x.date, k, role);
            counts[st][x.date][k][role] = r ? { have: countAt(ctx, cells, st, x.date, k, role), min: r.min, soft: r.soft } : null;
          });
        });
      });
    });
    var storeName = {}; M.stores.forEach(function (s) { storeName[s.code] = s.name; });
    var roleName = { pharm: '薬剤師', clerk: '事務' }, slotName = { AM: '午前', PM: '午後' };
    ctx.stores.forEach(function (st) {
      ctx.days.forEach(function (x) {
        SLOTS.forEach(function (k) {
          ['pharm', 'clerk'].forEach(function (role) {
            var c = counts[st][x.date][k][role];

    if (!c.AM && !c.PM && !c.N) delete map[id][date];
    S.dirty = true;
    if (S.mode === 'shift') S.touched = true;
    refresh();
  }
  function onGrid(e) {
    var nm = e.target.closest('th[data-staff]');
    if (nm) { openStaff(nm.dataset.staff); return; }
    var td = e.target.closest('td.cell');
    if (!td) return;
    if (S.sel === '__text') { typeIn(td); return; }
    if (!S.sel) {
      // ダブルクリック（手入力）の1回目では案内を出さない
      clearTimeout(S.hintTimer);
      S.hintTimer = setTimeout(function () { toast('上の記号を選ぶか、セルをダブルクリックして手入力してください'); }, 350);
      return;
    }
    var id = td.dataset.id, date = td.dataset.date, row = td.dataset.row;
    var map = S.mode === 'req' ? S.requests : S.cells;
    map[id] = map[id] || {};
    var c = map[id][date] = map[id][date] || { AM: '', PM: '', N: '' };
    var code = S.sel;
    if (code === '__clear') {
      if (row === 'N') c.N = '';
      else if (S.both) { c.AM = ''; c.PM = ''; }
      else c[row] = '';
    } else if (L.NIGHT.indexOf(code) >= 0) {
      c.N = c.N === code ? '' : code;
    } else if (row === 'N') {
      toast('夜の行には「準夜」「深夜」だけを入れられます'); return;
    } else if (S.both) {
      c.AM = code; c.PM = code;
    } else {
      c[row] = c[row] === code ? '' : code;
    }
    if (!c.AM && !c.PM && !c.N) delete map[id][date];
    S.dirty = true;
    if (S.mode === 'shift') S.touched = true;
    refresh();
  }
  function setMode(m) {
    S.mode = m;
    Array.prototype.forEach.call($('modeSeg').children, function (b) { b.classList.toggle('on', b.dataset.mode === m); });
    document.body.classList.toggle('mode-req', m === 'req');
    if (m === 'req' && S.sel && S.master && S.master.stores.some(function (s) { return s.code === S.sel; })) S.sel = null;
    refresh();
  }

  // ---------- 表示 ----------
  function cls(v) {
    if (!v) return '';
    if (S.master.stores.some(function (s) { return s.code === v; })) return 'v-' + v;
    var head = v.charAt(0);
    if (v.length > 1 && S.master.stores.some(function (s) { return s.code === head; })) return 'v-' + head + ' txt';
    if (AWAY.indexOf(v) >= 0 || v === '出') return 'v-away';
    if (OFF.indexOf(v) >= 0) return 'v-off';
    return 'v-away txt';
  }
  function refresh() {
    if (!S.master) return;
    var p = ymParts();
    S.result = L.validate(S.master, S.requests, S.cells, p[0], p[1]);
    renderPalette();
    renderGrid();
    renderSide();
  }
  function renderGrid() {
    var r = S.result, ctx = r.ctx, days = ctx.days;
    var bad = {};
    r.issues.forEach(function (i) { if (i.id && i.date) bad[i.id + '|' + i.date] = true; });
    var h = '<thead><tr class="r1"><th class="sticky">氏名</th><th class="sticky2">区分</th>';
    days.forEach(function (x) {
      var c = [x.dow === 0 ? 'sun' : x.dow === 6 ? 'sat' : '', x.holiday ? 'hol' : '', x.duty ? 'duty' : '', x.special ? 'special' : '', S.hlDate === x.date ? 'hl' : ''].join(' ');
      var closedStores = S.master.stores.filter(function (t) { return ctx.storeHol[x.date + '|' + t.code]; }).map(function (t) { return t.name; });
      var title = [x.holiday, closedStores.length ? closedStores.join('・') + '休業' : '', x.duty ? '夜間当番日' : '', x.special ? x.special.name : ''].filter(Boolean).join(' / ');
      if (closedStores.length) c += ' partclosed';
      h += '<th class="' + c + '" title="' + esc(title) + '"><span>' + x.d + '</span></th>';
    });
    // 右端：休みの集計（公平性の確認用）
    var extra = 2 + r.periods.length;
    h += '<th class="tally" title="店舗の休業日・定休・休など">公休</th><th class="tally" title="有給・特休">有給等</th>';
    r.periods.forEach(function (p) { h += '<th class="tally" title="' + esc(p.name) + 'の休み / そろえる日数">' + esc(p.name) + '</th>'; });
    h += '</tr><tr class="r2"><th class="sticky"></th><th class="sticky2"></th>';
    days.forEach(function (x) { h += '<th class="' + (x.dow === 0 || x.holiday ? 'sun' : x.dow === 6 ? 'sat' : '') + '">' + WD[x.dow] + '</th>'; });
    for (var e = 0; e < extra; e++) h += '<th class="tally"></th>';
    h += '</tr></thead>';

    // 人数の集計
    h += '<tbody class="sum">';
    var roles = [['pharm', '薬'], ['clerk', '事務']];
    S.master.stores.forEach(function (st) {
      roles.forEach(function (ro) {
        L.SLOTS.forEach(function (k) {
          h += '<tr><th class="sticky">' + esc(st.name) + ' ' + ro[1] + '</th><th class="sticky2">' + (k === 'AM' ? '午前' : '午後') + '</th>';
          days.forEach(function (x) {
            var c = r.counts[st.code][x.date][k][ro[0]];
            if (!c) { h += '<td class="closed"></td>'; return; }
            var cl = c.have < c.min ? (c.soft ? 'soft' : 'short') : 'okc';
            h += '<td class="' + cl + '" title="' + c.have + '人 / 必要' + c.min + '人">' + c.have + '/' + c.min + '</td>';
          });
          h += '<td colspan="' + extra + '" class="tally"></td></tr>';
        });
      });
    });
    [['eve', 'eveNeed', '準夜 16-24'], ['late', 'lateNeed', '深夜 0-9']].forEach(function (n) {
      h += '<tr><th class="sticky">夜間当番</th><th class="sticky2">' + n[2].split(' ')[0] + '</th>';
      days.forEach(function (x) {
        var c = r.night[x.date];
        if (!c[n[1]] && !c[n[0]]) { h += '<td class="closed"></td>'; return; }
        h += '<td class="' + (c[n[0]] < c[n[1]] ? 'short' : 'okc') + '">' + c[n[0]] + '/' + c[n[1]] + '</td>';
      });
      h += '<td colspan="' + extra + '" class="tally"></td></tr>';
    });
    h += '<tr class="gap"><td colspan="' + (days.length + 2 + extra) + '"></td></tr></tbody>';

    // 社員
    var view = S.mode === 'req' ? S.requests : S.cells;
    h += '<tbody>';
    ctx.staff.forEach(function (s) {
      var rows = s.night ? ['AM', 'PM', 'N'] : ['AM', 'PM'];
      rows.forEach(function (row, ri) {
        var trc = row === 'PM' && !s.night ? 'pm' : row === 'N' ? 'nt pm' : '';
        h += '<tr class="' + trc + '">';
        if (ri === 0) {
          var sub = [s.job, s.kind, s.fixed ? '固定' : ''].filter(Boolean).join('・');
          var note = s.kind === '非常勤' && s.weeklyMax ? '週' + s.weeklyMax + '日まで' : s.fixed ? '固定' : '';
          h += '<th class="sticky name' + (S.hlId === s.id ? ' hl' : '') + '" rowspan="' + rows.length + '" data-staff="' + esc(s.id) + '" title="' + esc(sub) + '（押すと設定を変更）">' +
            esc(s.name) + (note ? '<small>' + esc(note) + '</small>' : '') + '</th>';
        }
        h += '<th class="sticky2">' + (row === 'AM' ? '午前' : row === 'PM' ? '午後' : '夜') + '</th>';
        days.forEach(function (x) {
          var c = (view[s.id] && view[s.id][x.date]) || {};
          var v = c[row] || '';
          var rq = S.requests[s.id] && S.requests[s.id][x.date];
          var classes = ['cell'];
          if (row === 'N') { if (v) classes.push('v-night'); }
          else {
            classes.push(cls(v));
            var open = s.home ? L.openKind(ctx, s.home, x.date, row) : true;
            if (!v && !open) classes.push('closed');
          }
          if (S.mode === 'shift' && rq && rq[row]) classes.push('locked');
          if (S.mode === 'shift' && bad[s.id + '|' + x.date]) classes.push('bad');
          if (S.hlDate === x.date && (!S.hlId || S.hlId === s.id)) classes.push('hl');
          var html;
          if (row === 'N') html = v === '準夜' ? '準' : v === '深夜' ? '深' : '';
          else {
            html = esc(v);
            var isSat = x.dow === 6, isStoreV = S.master.stores.some(function (t) { return t.code === v; });
            var end = !isStoreV ? '' : (row === 'PM' && !isSat) ? s.endWeekday : (row === 'AM' && isSat) ? s.endSat : '';
            if (end) html += '<small>~' + esc(end) + '</small>';
          }
          h += '<td class="' + classes.join(' ') + '" data-id="' + esc(s.id) + '" data-date="' + x.date + '" data-row="' + row + '">' + html + '</td>';
        });
        if (ri === 0) {
          var sm = r.summary[s.id], reg = s.kind === '常勤' || s.kind === '準常勤';
          h += '<td class="tally num" rowspan="' + rows.length + '">' + (reg ? sm.off : '') + '</td>';
          h += '<td class="tally num" rowspan="' + rows.length + '">' + (reg && sm.leave ? sm.leave : '') + '</td>';
          sm.periods.forEach(function (p) {
            var cl = !reg ? '' : p.off === p.target ? 'okc' : p.off > p.target ? 'over' : 'under';
            h += '<td class="tally num ' + cl + '" rowspan="' + rows.length + '">' + (reg ? p.off + '/' + p.target : '') + '</td>';
          });
        }
        h += '</tr>';
      });
    });
    h += '</tbody>';
    $('grid').innerHTML = h;
  }
  function renderSide() {
    var iss = S.result.issues;
    var ne = iss.filter(function (i) { return i.level === 'error'; }).length, nw = iss.length - ne;
    var h = '<h2>確認が必要なこと</h2><div class="counts"><span class="pill error">要対応 ' + ne + '</span><span class="pill warn">注意 ' + nw + '</span></div>';
    if (!iss.length) h += '<p>問題は見つかりませんでした。</p>';
    iss.slice(0, 300).forEach(function (i, n) {
      var d = i.date ? (+i.date.slice(5, 7)) + '/' + (+i.date.slice(8, 10)) : '';
      h += '<div class="issue ' + i.level + '" data-n="' + n + '"><span class="d">' + d + '</span>' + esc(i.msg) + '</div>';
    });
    if (iss.length > 300) h += '<p>ほか ' + (iss.length - 300) + ' 件</p>';
    h += '<div class="legend"><b>表の見方</b><br>' +
      '数字の行：配置人数 / 必要人数（赤＝不足、黄＝特別期間の不足）<br>' +
      '茶色の枠：希望入力で決まっている枠（自動作成で変わらない）<br>' +
      '赤い枠：その日にルール違反がある<br>' +
      '日付が黒：夜間当番日　黄色の日付：特別期間<br>' +
      '<b>記号</b>　※・重信：出勤扱いで店舗にいない　在宅：在宅勤務　夜：準夜勤の日の日中（勤務なし・人数に数えない）　入：深夜勤の前日の午後（勤務なし）　明：深夜勤明け　出：出勤希望（非常勤）<br>' +
      '<b>休み</b>　定休・休は週2日の公休。有給・特休（お盆など）は公休とは別に取る<br>' +
      '<b>社員の設定</b>　氏名を押すと、週の出勤上限などを変更できます<br>' +
      '<b>右端の集計</b>　正社員の公休・有給等の日数。特別期間は「休み/そろえる日数」（黄＝少ない、青＝多い）<br>' +
      '<b>日付の点線</b>　一部の店舗だけ休業（日付にマウスを乗せると店舗名）<br>' +
      '<b>手入力</b>　セルをダブルクリック（または「✎ 手入力」を選んでセルを押す）と、「三 8:30-14:30」などを自由に書けます。先頭が店舗の記号ならその店舗の人数に数えます<br>' +
      '<b>印刷</b>　「備考」を書いて保存 →「印刷（PDF・A3横）」で1枚にまとまったPDFが開きます</div>';
    $('side').innerHTML = h;
  }
  function onSide(e) {
    var d = e.target.closest('.issue');
    if (!d) return;
    var i = S.result.issues[+d.dataset.n];
    S.hlDate = i.date; S.hlId = i.id;
    renderGrid();
    var cell = document.querySelector('#grid td.hl, #grid th.hl');
    if (cell) cell.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  }

  // ---------- 社員の設定 ----------
  function openStaff(id) {
    var s = S.master.staff.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    var stores = S.master.stores;
    var f = $('staffForm');
    f.dataset.id = id;
    $('sfName').textContent = s.name + '（' + s.job + '）';
    f.kind.value = s.kind || '常勤';
    f.home.innerHTML = stores.map(function (t) { return '<option value="' + esc(t.code) + '">' + esc(t.name) + '</option>'; }).join('');
    f.home.value = s.home;
    f.fixed.checked = !!s.fixed;
    f.night.checked = !!s.night;
    $('sfCan').innerHTML = stores.map(function (t) {
      return '<label><input type="checkbox" name="can" value="' + esc(t.code) + '"' + ((s.canStores || []).indexOf(t.code) >= 0 ? ' checked' : '') + '>' + esc(t.name) + '</label>';
    }).join('');
    $('sfNg').innerHTML = WD.split('').map(function (w, i) {
      return '<label><input type="checkbox" name="ng" value="' + i + '"' + ((s.ngWeekdays || []).indexOf(i) >= 0 ? ' checked' : '') + '>' + w + '</label>';
    }).join('');
    $('sfPref').innerHTML = WD.split('').map(function (w, i) {
      return '<label><input type="checkbox" name="pref" value="' + i + '"' + ((s.prefOffWeekdays || []).indexOf(i) >= 0 ? ' checked' : '') + '>' + w + '</label>';
    }).join('');
    f.weeklyMax.value = s.weeklyMax || '';
    f.weeklyStoreMax.value = s.weeklyStoreMax || '';
    f.weeklyRemote.value = s.weeklyRemote || '';
    $('staffDlg').showModal();
  }
  function saveStaffForm(e) {
    e.preventDefault();
    var f = $('staffForm');
    var s = S.master.staff.filter(function (x) { return x.id === f.dataset.id; })[0];
    function num(v) { return v === '' ? null : Math.max(0, +v); }
    s.kind = f.kind.value;
    s.home = f.home.value;
    s.fixed = f.fixed.checked;
    s.night = f.night.checked;
    s.canStores = Array.prototype.map.call(f.querySelectorAll('input[name=can]:checked'), function (i) { return i.value; })
      .filter(function (c) { return c !== s.home; });
    s.ngWeekdays = Array.prototype.map.call(f.querySelectorAll('input[name=ng]:checked'), function (i) { return +i.value; });
    s.prefOffWeekdays = Array.prototype.map.call(f.querySelectorAll('input[name=pref]:checked'), function (i) { return +i.value; });
    s.weeklyMax = num(f.weeklyMax.value);
    s.weeklyStoreMax = num(f.weeklyStoreMax.value);
    s.weeklyRemote = num(f.weeklyRemote.value) || 0;
    $('staffDlg').close();
    refresh();
    call('saveStaff', s).then(function () {
      toast(DEMO ? '設定を変えました（デモのため保存されません）' : s.name + 'さんの設定を保存しました');
    }).catch(function (err) { alert('設定の保存に失敗しました：' + (err && err.message || err)); });
  }

  // ---------- 起動 ----------
  function init() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    $('ym').value = DEMO ? SAMPLE.ym : next.getFullYear() + '-' + ('0' + (next.getMonth() + 1)).slice(-2);
    $('demo').hidden = !DEMO;
    $('btnLoad').onclick = load;
    $('ym').onchange = load;
    $('btnGen').onclick = generate;
    $('btnSave').onclick = function () { save(false); };
    $('btnPrint').onclick = function () { printSheet(false); };
    $('btnPdf').onclick = function () { printSheet(true); };
    $('btnNote').onclick = function () { $('noteText').value = S.note || ''; $('noteDlg').showModal(); };
    $('noteCancel').onclick = function () { $('noteDlg').close(); };
    $('noteForm').onsubmit = function (e) {
      e.preventDefault();
      if ((S.note || '') !== $('noteText').value) { S.note = $('noteText').value; S.dirty = true; status('備考を変更しました（保存を押すと記録されます）'); }
      $('noteDlg').close();
    };
    $('grid').ondblclick = function (e) { clearTimeout(S.hintTimer); var td = e.target.closest('td.cell'); if (td) typeIn(td); };
    $('modeSeg').onclick = function (e) { var b = e.target.closest('button'); if (b) setMode(b.dataset.mode); };
    $('palette').onclick = onPalette;
    $('grid').onclick = onGrid;
    $('side').onclick = onSide;
    $('staffForm').onsubmit = saveStaffForm;
    $('sfCancel').onclick = function () { $('staffDlg').close(); };
    window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
    load();
  }
  init();
})();
</script>

</body>
</html>
