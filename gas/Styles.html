<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2733; --muted: #6b7785; --line: #d9dee4; --line-strong: #aab3bd;
    --accent: #1f6feb; --err: #d1242f; --err-bg: #ffe9ea; --warn: #9a6700; --warn-bg: #fff4d6; --ok-bg: #e7f6ec;
    --closed: #eceef1; --duty: #222; --away: #fff1b8; --off: #f0f1f3;
    --s-一: #dbe7ff; --s-三: #d8f3dc; --s-中: #ffe3cc; --s-山: #eadcff; --s-松: #cff4f1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; background: var(--bg); color: var(--ink); font-size: 13px; }
  header { position: sticky; top: 0; z-index: 30; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button, select, input { font: inherit; }
  button { border: 1px solid var(--line-strong); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #f0f3f6; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.05); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: var(--ink); color: #fff; }
  .status { color: var(--muted); margin-left: auto; }
  .demo { background: var(--warn-bg); color: var(--warn); padding: 6px 12px; border-bottom: 1px solid var(--line); }
  .palette { position: sticky; top: 46px; z-index: 25; background: var(--panel); border-bottom: 1px solid var(--line); padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .palette .label { color: var(--muted); margin-right: 4px; }
  .palette button { min-width: 34px; padding: 3px 7px; }
  .palette button.sel { outline: 2px solid var(--accent); outline-offset: 1px; font-weight: bold; }
  .palette .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 0; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .gridwrap { overflow: auto; max-height: calc(100vh - 92px); }
  table.grid { border-collapse: separate; border-spacing: 0; }
  .grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; padding: 0; height: 20px; min-width: 30px; }
  .grid thead th { position: sticky; background: var(--panel); z-index: 10; font-weight: normal; }
  .grid thead tr.r1 th { top: 0; height: 22px; }
  .grid thead tr.r2 th { top: 22px; height: 20px; }
  .grid .sticky { position: sticky; left: 0; z-index: 5; background: var(--panel); text-align: left; padding: 0 6px; min-width: 110px; }
  .grid .sticky2 { position: sticky; left: 110px; z-index: 5; background: var(--panel); min-width: 44px; color: var(--muted); font-size: 11px; }
  .grid thead .sticky, .grid thead .sticky2 { z-index: 15; }
  .grid th.sun, .grid th.hol { color: var(--err); }
  .grid th.sat { color: var(--accent); }
  .grid th.duty span { background: var(--duty); color: #fff; border-radius: 3px; padding: 0 4px; }
  .grid th.special { background: var(--warn-bg); }
  .grid td.closed { background: var(--closed); }
  .grid tr.pm td, .grid tr.pm th { border-bottom-color: var(--line-strong); }
  .grid tr.nt td { height: 16px; font-size: 10px; }
  .grid tr.nt td.cell { color: #fff; }
  .grid td.cell { cursor: pointer; font-size: 12px; }
  .grid td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grid td.v-一 { background: var(--s-一); } .grid td.v-三 { background: var(--s-三); } .grid td.v-中 { background: var(--s-中); }
  .grid td.v-山 { background: var(--s-山); } .grid td.v-松 { background: var(--s-松); }
  .grid td.v-away { background: var(--away); }
  .grid td.v-off { background: var(--off); color: var(--muted); font-size: 11px; }
  .grid td.v-night { background: #34495e; color: #fff; }
  .grid td.locked { box-shadow: inset 0 0 0 1.5px #8c6d1f; }
  .grid td.bad { box-shadow: inset 0 0 0 2px var(--err); }
  .grid td.hl, .grid th.hl { outline: 2px solid var(--accent); outline-offset: -2px; }
  .grid tbody.sum td { font-size: 11px; }
  .grid tbody.sum td.short { background: var(--err-bg); color: var(--err); font-weight: bold; }
  .grid tbody.sum td.soft { background: var(--warn-bg); color: var(--warn); font-weight: bold; }
  .grid tbody.sum td.okc { color: var(--muted); }
  .grid tbody.sum tr.gap td { height: 6px; border: 0; background: var(--bg); }
  .grid tr.staff-first td, .grid tr.staff-first th { border-top: 0; }
  aside { border-left: 1px solid var(--line); background: var(--panel); max-height: calc(100vh - 92px); overflow: auto; padding: 10px 12px; }
  aside h2 { font-size: 13px; margin: 6px 0; }
  .issue { padding: 5px 6px; border-radius: 5px; margin-bottom: 4px; cursor: pointer; line-height: 1.4; }
  .issue.error { background: var(--err-bg); color: var(--err); }
  .issue.warn { background: var(--warn-bg); color: var(--warn); }
  .issue .d { font-weight: bold; margin-right: 6px; }
  .counts { display: flex; gap: 8px; margin-bottom: 6px; }
  .pill { border-radius: 99px; padding: 2px 8px; font-weight: bold; }
  .pill.error { background: var(--err-bg); color: var(--err); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .legend { color: var(--muted); line-height: 1.7; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .legend b { color: var(--ink); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  .toast.show { opacity: 1; }
  .mode-req .grid td.cell:not(.locked) { color: #b8bec6; }
  .grid th.name { cursor: pointer; }
  .grid th.name:hover { color: var(--accent); text-decoration: underline; }
  .grid th.name small { display: block; color: var(--muted); font-size: 10px; font-weight: normal; }
  .grid td.cell small { font-size: 9px; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.3); }
  dialog h2 { font-size: 15px; margin: 0 0 12px; }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; }
  .frow > label:first-child { width: 120px; color: var(--muted); }
  .frow input[type=number] { width: 190px; padding: 3px 6px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .hint { color: var(--muted); margin: 4px 0 12px; }
  .factions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
